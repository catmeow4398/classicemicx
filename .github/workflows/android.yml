name: Android APK

on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      # sdkmanager necesita Java 17+
      - name: Configurar Java 17 (para sdkmanager)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Instalar SDK, CMake y NDK
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          set +o pipefail
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-28" "build-tools;28.0.3" \
                  "cmake;3.10.2.4988404" "ndk;25.2.9519653"

      - name: Reparar herramientas strip del NDK
        run: |
          NDK_BIN="$ANDROID_HOME/ndk/25.2.9519653/toolchains/llvm/prebuilt/linux-x86_64/bin"
          chmod +x "$NDK_BIN/llvm-strip"
          for t in arm-linux-androideabi aarch64-linux-android i686-linux-android x86_64-linux-android; do
            ln -sf llvm-strip "$NDK_BIN/$t-strip"
          done

      # Gradle 5.6.4 + Android plugin 3.6.4 solo funcionan con Java 8-11
      - name: Configurar Java 11 (para Gradle)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 11

      - name: Extraer codigo fuente (si viene en zip)
        run: |
          if ls CODIGO_FUENTE*.zip >/dev/null 2>&1; then
            unzip -q CODIGO_FUENTE*.zip -d fuente
          fi

      - name: Parchear CMakeLists (archivos nuevos + --wrap)
        run: |
          C=$(find . -path '*misc/android/app/CMakeLists.txt' | head -1)
          [ -z "$C" ] && { echo "ERROR: no se encontro CMakeLists.txt"; exit 1; }
          cat > /tmp/patch_cmake.py <<'PYEOF'
          import sys, re
          p = sys.argv[1]
          s = open(p).read()
          new = ["AutoReconnect","CpsCmd","CrashCmd","Favs","FeedbackCmd","MusicCmd",
                 "NoPitch","OmniCmd","RichCmd","TranslateCmd","WpCmd"]
          anchor = "        ../../../src/Commands.c\n"
          assert anchor in s, "no se encontro Commands.c en CMakeLists"
          add = "".join("        ../../../src/%s.c\n" % n for n in new
                        if "src/%s.c" % n not in s)
          s = s.replace(anchor, anchor + add, 1)
          if "--wrap=" not in s:
              s += """
          # Funciones envueltas con -Wl,--wrap (CrashCmd.c y OmniCmd.c)
          set_target_properties(classicube PROPERTIES LINK_FLAGS
              "-Wl,--wrap=Logger_DoAbort -Wl,--wrap=Process_Abort2 -Wl,--wrap=World_SetBlock")
          """
          open(p, "w").write(s)
          print("CMakeLists parcheado")
          PYEOF
          python3 /tmp/patch_cmake.py "$C"

      - name: Compilar APK
        run: |
          G=$(find . -path '*misc/android/gradlew' | head -1)
          [ -z "$G" ] && { echo "ERROR: no se encontro misc/android/gradlew"; exit 1; }
          cd "$(dirname "$G")"
          chmod +x gradlew
          set +e
          ./gradlew assembleDebug --stacktrace --console=plain > "$GITHUB_WORKSPACE/build.log" 2>&1
          RC=$?
          echo "=== RESUMEN DEL ERROR (exit $RC) ==="
          grep -n -i -B2 -A12 "FAILURE:\|What went wrong\|error:\|Caused by" "$GITHUB_WORKSPACE/build.log" | head -n 80
          echo "=== ULTIMAS 40 LINEAS ==="
          tail -n 40 "$GITHUB_WORKSPACE/build.log"
          exit $RC

      - name: Subir log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: ClassiEmicx-apk
          path: '**/app/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
